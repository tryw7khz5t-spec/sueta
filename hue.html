<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Эксклюзивный контент</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            text-align: center;
        }

        .btn {
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            background-color: #007bff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: background 0.2s;
        }

        .btn:hover {
            background-color: #0056b3;
        }

        .loader {
            display: none;
            margin-top: 20px;
            font-size: 16px;
            color: #aaa;
        }

        #screamer {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: black;
            z-index: 9999;
        }

        #screamer img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2 id="title-text">🔒 Для просмотра содержимого нажмите кнопку</h2>
        <button id="main-btn" class="btn" onclick="prepareScreamer()">Открыть доступ</button>
        <div id="loader" class="loader">Загрузка контента, подождите...</div>
    </div>

    <!-- Полноэкранный скример -->
    <div id="screamer">
        <img id="scare-img" src="https://static.wikia.nocookie.net/grenada/images/b/be/%D0%A1%D0%BA%D1%80%D0%B8%D0%BC%D0%B5%D1%80_%D0%BD%D0%B0%D1%81%D1%80%D0%B0%D0%BB%D0%BE%D0%B2%D0%B8%D1%87.jpg/revision/latest?cb=20241106151856&path-prefix=ru" alt="BOO!">
    </div>

    <!-- Звук скримера -->
    <audio id="scare-sound" preload="auto">
        <source src="https://www.myinstants.com/media/sounds/screamer-sound.mp3" type="audio/mpeg">
    </audio>

    <script>
        function prepareScreamer() {
            // Показываем надпись "Загрузка..." и скрываем кнопку
            document.getElementById('main-btn').style.display = 'none';
            document.getElementById('loader').style.display = 'block';

            // Устанавливаем задержку 3000 мс (3 секунды) перед вызовом скримера
            setTimeout(triggerScreamer, 3000);
        }

        function triggerScreamer() {
            const screamer = document.getElementById('screamer');
            screamer.style.display = 'block';

            // Включаем звук
            const sound = document.getElementById('scare-sound');
            sound.volume = 1.0;
            sound.play();

            // Перевод в полноэкранный режим
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen();
            }

            // Запуск вибрации на смартфонах (пульсация: 500мс вибро, 100мс пауза)
            if ("vibrate" in navigator) {
                navigator.vibrate([500, 100, 500, 100, 500, 100, 1000]);
            }

            // Мигание фона (красный/черный)
            let isRed = false;
            setInterval(() => {
                screamer.style.backgroundColor = isRed ? 'black' : 'red';
                isRed = !isRed;
            }, 50);
        }
    </script>

</body>
</html>
